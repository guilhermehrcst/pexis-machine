name: Deploy Web Lab to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Web Lab
    runs-on: ubuntu-latest
    env:
      EMSDK_VERSION: "4.0.23"
      VITE_BASE_PATH: /pexis-machine/

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Emscripten ${{ env.EMSDK_VERSION }}
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"

      - name: Build WebAssembly adapter
        run: |
          source "$RUNNER_TEMP/emsdk/emsdk_env.sh"
          ./scripts/build-wasm.sh

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Build production Web Lab
        working-directory: web
        run: npm run build

      - name: Verify Pages assets
        run: |
          test -f web/dist/index.html
          grep -q '/pexis-machine/assets/' web/dist/index.html
          find web/dist/assets -maxdepth 1 -type f -name '*.wasm' -print -quit | grep -q .

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    name: Deploy GitHub Pages
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
